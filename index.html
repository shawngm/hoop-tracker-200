  <style>
    :root{--orange:#ff7a00;--green:#34c759;--red:#ff3b30;--dark:#111827;--soft:#f3f4f6;--muted:#6b7280;--radius:22px}*{box-sizing:border-box;max-width:100%}html,body{width:100%;overflow-x:hidden}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:radial-gradient(circle at top,#334155 0,#111827 45%,#030712 100%);color:#fff;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.header{position:sticky;top:0;z-index:10;background:rgba(3,7,18,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:env(safe-area-inset-top,14px);border-bottom:1px solid rgba(255,255,255,.08)}.brand{padding:14px 16px 4px;text-align:center}.brand h1{margin:0;font-size:22px;letter-spacing:-.5px}.brand p{margin:4px 0 0;color:#cbd5e1;font-size:12px;font-weight:750}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab-btn{border:0;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:900;white-space:nowrap;scroll-snap-align:start}.tab-btn.active{background:#fff;color:#111827;transform:scale(1.03)}.container{width:100%;max-width:560px;margin:0 auto;padding:16px 14px 110px}.section-title{font-size:24px;font-weight:950;margin:6px 2px 14px;text-shadow:0 2px 10px rgba(0,0,0,.35)}.card,.drill-card{background:rgba(255,255,255,.95);color:#111827;border-radius:var(--radius);padding:17px;margin-bottom:14px;box-shadow:0 14px 35px rgba(0,0,0,.22)}.hero{background:linear-gradient(135deg,#fff,#fff3e4)}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:950;color:var(--orange);margin-bottom:8px}.muted{color:var(--muted);font-size:13px;line-height:1.35;font-weight:650}.big{font-size:36px;font-weight:950;line-height:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:rgba(0,0,0,.06);border-radius:18px;padding:13px}.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:950}.stat-num{font-size:25px;font-weight:950;margin-top:4px}.shortcut{background:rgba(255,255,255,.95);border-radius:20px;color:#111827;min-height:86px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:950;padding:16px 10px}.shortcut small{display:block;color:var(--muted);font-size:12px;margin-top:5px;font-weight:750}.wide{grid-column:span 2}.progress-wrap{height:14px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden;margin:12px 0}.progress-fill{height:100%;background:var(--green);width:0;border-radius:999px;transition:.25s}.progress-fill.orange{background:var(--orange)}.drill-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.drill-name{font-size:18px;font-weight:950;line-height:1.1}.pill{background:#eef2ff;color:#3730a3;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:950;white-space:nowrap}.last-line{background:#eff6ff;color:#075985;border-radius:14px;padding:9px 11px;font-size:13px;line-height:1.25;font-weight:850;margin-bottom:12px}.make-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.make-btn{border:0;border-radius:18px;background:var(--green);color:#fff;font-size:22px;font-weight:950;min-height:74px}.undo-btn,.done-btn,.finish-btn,.secondary-btn{border:0;border-radius:18px;font-weight:950}.undo-btn{background:#fee2e2;color:#991b1b;min-height:74px;font-size:16px}.done-btn{width:100%;margin-top:10px;padding:14px;background:#f3f4f6;color:#111827}.done-btn.done{background:#dcfce7;color:#166534}.shot-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.shot-box{background:rgba(0,0,0,.06);border-radius:16px;padding:11px;text-align:center}.shot-box b{display:block;font-size:23px}.shot-box span{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:950}.tip{border-left:5px solid var(--orange);padding:12px;background:#fff7ed;border-radius:14px;margin-top:10px;font-weight:800;line-height:1.35}.good{border-left-color:var(--green);background:#f0fdf4}.bad{border-left-color:var(--red);background:#fef2f2}.mini-row{border-top:1px solid rgba(0,0,0,.08);padding:10px 0;font-size:14px;font-weight:800}.finish-btn,.secondary-btn{width:100%;padding:17px;margin-top:10px}.finish-btn{background:#111827;color:#fff;font-size:18px}.secondary-btn{background:rgba(0,0,0,.08);color:#111827;font-size:14px}.history-row{border-top:1px solid rgba(0,0,0,.08);padding:11px 0;font-size:14px;font-weight:800}.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{border-radius:999px;background:rgba(0,0,0,.07);padding:8px 10px;font-size:12px;font-weight:900}.danger{background:#fee2e2;color:#991b1b}.celebrate{position:fixed;inset:0;background:rgba(3,7,18,.94);display:none;z-index:99;align-items:center;justify-content:center;text-align:center;padding:24px}.celebrate h2{font-size:38px;margin:0;color:#fbbf24}.celebrate p{color:#fff;font-weight:800}@media(max-width:360px){.container{padding-left:10px;padding-right:10px}.grid,.make-row,.shot-stats{grid-template-columns:1fr}.wide{grid-column:span 1}.drill-top{flex-direction:column}.big{font-size:30px}}
  </style>

<body>
  <div class="header"><div class="brand"><h1>🏀 Hoop Tracker 200</h1><p>Tap makes. Misses calculate automatically.</p></div><div class="tabs" id="tabs"></div></div>
  <main class="container" id="content"></main>
  <div class="celebrate" id="celebrate"><div><h2>Workout Saved</h2><p id="celebrateText">Progress is progress.</p></div></div>
<script>
const STORAGE={sessions:'hoop_sessions_v2',plan:'hoop_plan_v2',active:'hoop_active_v2'};
const tabs=['Today','Form','Midrange','Three','Free Throws','Progress','Tips'];
const weekTargets=[80,100,120,140,160,175,190,200];
const allDrills=[
{id:'mikan',name:'Mikan Drill',cat:'Form',base:10,max:20,tip:'Soft touch. Eyes on the square. Finish high with both hands.'},
{id:'form3',name:'One-Hand Form — 3 Feet',cat:'Form',base:10,max:20,tip:'Minimal jump. Elbow in. Same release point every rep.'},
{id:'form5',name:'One-Hand Form — 5 Feet',cat:'Form',base:10,max:20,tip:'Quick gather, smooth lift, high arc, hold the follow-through.'},
{id:'form7',name:'One-Hand Form — 7 Feet',cat:'Form',base:0,max:20,tip:'Do not force distance. Keep touch soft and repeatable.'},
{id:'ft1',name:'Free Throws',cat:'Free Throws',base:10,max:20,tip:'Same routine every time. Breathe, bend, finish through the rim.'},
{id:'elbow',name:'Elbow to Elbow',cat:'Midrange',base:10,max:20,tip:'Sprint to balance. Square up before the shot.'},
{id:'mid5',name:'5 Spot Midrange',cat:'Midrange',base:15,max:25,tip:'One clean target at each spot. Feet set, eyes early.'},
{id:'three5',name:'5 Spot Three-Pointers',cat:'Three',base:10,max:25,tip:'Range comes from legs and rhythm, not pushing with the arms.'},
{id:'pull1',name:'1-Dribble Pull-Up',cat:'Midrange',base:0,max:15,tip:'Pound, plant, rise balanced. Do not fade unless intended.'},
{id:'pull2',name:'2-Dribble Pull-Up',cat:'Three',base:0,max:15,tip:'Slow the gather just enough to land balanced.'},
{id:'ft2',name:'Pressure Free Throws',cat:'Free Throws',base:5,max:20,tip:'Treat these like late-game reps. Same routine under fatigue.'}
];
function pct(m,a){return a?Math.round((Number(m||0)/Number(a||0))*100):0}
function todayKey(d=new Date()){return d.toISOString().slice(0,10)}
function startOfWeek(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function getSessions(){return JSON.parse(localStorage.getItem(STORAGE.sessions)||'[]')}
function saveSessions(s){localStorage.setItem(STORAGE.sessions,JSON.stringify(s))}
function defaultPlan(){return{week:1,goal:80,workoutsPerWeek:3,lastReview:null}}
function getPlan(){return{...defaultPlan(),...(JSON.parse(localStorage.getItem(STORAGE.plan)||'null')||{})}}
function savePlan(p){localStorage.setItem(STORAGE.plan,JSON.stringify(p))}
function getActive(){return JSON.parse(localStorage.getItem(STORAGE.active)||'{}')}
function saveActive(a){localStorage.setItem(STORAGE.active,JSON.stringify(a))}
function clearActive(){localStorage.removeItem(STORAGE.active)}
function weekSessions(){const start=startOfWeek().toISOString();return getSessions().filter(s=>s.timestamp>=start)}
function lastSession(){return getSessions().slice().sort((a,b)=>b.timestamp.localeCompare(a.timestamp))[0]||null}
function lastForDrill(id){for(const s of getSessions().slice().reverse()){const d=(s.drills||[]).find(x=>x.id===id&&x.completed);if(d)return{...d,date:s.date}}return null}
function targetsForGoal(goal){const totalBase=allDrills.reduce((s,d)=>s+d.base,0),totalMax=allDrills.reduce((s,d)=>s+d.max,0);const ratio=Math.max(0,Math.min(1,(goal-totalBase)/(totalMax-totalBase)));let rows=allDrills.map(d=>({...d,attempts:Math.round(d.base+(d.max-d.base)*ratio)})).filter(d=>d.attempts>0);let diff=goal-rows.reduce((s,d)=>s+d.attempts,0);let i=0;while(diff!==0&&rows.length){const d=rows[i%rows.length];if(diff>0&&d.attempts<d.max){d.attempts++;diff--}else if(diff<0&&d.attempts>d.base){d.attempts--;diff++}i++;if(i>500)break}return rows}
function currentDrills(){return targetsForGoal(getPlan().goal)}
function activeDrill(id){const a=getActive();a[id]=a[id]||{makes:0,completed:false};return a[id]}
function setDrill(id,data){const a=getActive();a[id]={...(a[id]||{}),...data};saveActive(a)}
function addMake(id,max){const d=activeDrill(id);setDrill(id,{makes:Math.min(max,Number(d.makes||0)+1)});showView(currentView)}
function undoMake(id){const d=activeDrill(id);setDrill(id,{makes:Math.max(0,Number(d.makes||0)-1)});showView(currentView)}
function toggleDone(id){const d=activeDrill(id);setDrill(id,{completed:!d.completed});showView(currentView)}
let currentView='Today';
function setupTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab-btn ${t==='Today'?'active':''}" onclick="showView('${t}')">${t}</button>`).join('')}
function showView(name){currentView=name;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.innerText===name));const c=document.getElementById('content');c.innerHTML='';if(name==='Today')return renderToday(c);if(name==='Progress')return renderProgress(c);if(name==='Tips')return renderTips(c);return renderCategory(c,name)}
function activeTotals(){const a=getActive();let makes=0,attempts=0,completed=0,totalDrills=0;currentDrills().forEach(d=>{totalDrills++;const x=a[d.id]||{};if(x.completed){completed++;attempts+=d.attempts;makes+=Math.min(Number(x.makes||0),d.attempts)}});return{makes,attempts,misses:Math.max(0,attempts-makes),percentage:pct(makes,attempts),completed,totalDrills}}
function renderToday(c){const p=getPlan(),ws=weekSessions(),last=lastSession(),t=activeTotals(),goalPct=Math.min(100,Math.round((t.attempts/p.goal)*100));const insight=smartInsights().primary;c.innerHTML=`<div class="section-title">Today</div><div class="card hero"><div class="label">Week ${p.week} plan</div><div class="big">${p.goal} attempts</div><div class="progress-wrap"><div class="progress-fill orange" style="width:${goalPct}%"></div></div><p class="muted">Completed today: ${t.attempts}/${p.goal} attempts • ${t.makes} makes • ${t.percentage}%.</p><p class="muted">Weekly target: ${p.workoutsPerWeek} workouts. Completed this week: ${ws.length}/${p.workoutsPerWeek}.</p></div><div class="grid"><div class="shortcut" onclick="showView('Form')">FORM<small>Mikan + touch</small></div><div class="shortcut" onclick="showView('Midrange')">MIDRANGE<small>Elbows + spots</small></div><div class="shortcut" onclick="showView('Three')">THREE<small>Range + rhythm</small></div><div class="shortcut" onclick="showView('Free Throws')">FREE THROWS<small>Routine + pressure</small></div><div class="shortcut wide" onclick="showView('Progress')">PROGRESS<small>${bestLine()}</small></div></div><div class="card"><strong>Last session</strong>${last?`<p class="muted">${last.date}: ${last.totalMakes}/${last.totalAttempts}, ${last.percentage}% • Week ${last.week}</p><div class="tip">Next focus: ${insight}</div>`:`<p class="muted">No sessions yet. Start with the fixed attempts, tap Make when it goes in, then mark each drill complete.</p>`}</div><button class="finish-btn" onclick="finishSession()">Finish & Save Session</button>`}
function renderCategory(c,cat){const ds=currentDrills().filter(d=>d.cat===cat);c.innerHTML=`<div class="section-title">${cat}</div><div class="card"><strong>Simple flow</strong><p class="muted">Each drill has a fixed number of attempts. Tap Make for each made shot. When the required shots are done, tap Mark Complete. Misses are calculated automatically.</p><div id="totalsBox"></div></div>`;ds.forEach(d=>c.innerHTML+=drillCard(d));c.innerHTML+=`<button class="finish-btn" onclick="finishSession()">Finish & Save Session</button>`;renderTotals()}
function drillCard(d){const state=activeDrill(d.id),makes=Math.min(Number(state.makes||0),d.attempts),misses=state.completed?Math.max(0,d.attempts-makes):0,last=lastForDrill(d.id);return`<div class="drill-card"><div class="drill-top"><div><div class="drill-name">${d.name}</div><p class="muted">${d.tip}</p></div><div class="pill">${d.attempts} attempts</div></div><div class="last-line">${last?`Last time (${last.date}): ${last.makes}/${last.attempts} — ${pct(last.makes,last.attempts)}%`:'Starter: complete the attempts, then mark the drill done.'}</div><div class="make-row"><button class="make-btn" onclick="addMake('${d.id}',${d.attempts})">+ MAKE</button><button class="undo-btn" onclick="undoMake('${d.id}')">Undo</button></div><button class="done-btn ${state.completed?'done':''}" onclick="toggleDone('${d.id}')">${state.completed?'✓ Drill Complete':'Mark Drill Complete'}</button><div class="shot-stats"><div class="shot-box"><b>${makes}</b><span>Makes</span></div><div class="shot-box"><b>${state.completed?d.attempts:'—'}</b><span>Attempts</span></div><div class="shot-box"><b>${state.completed?misses:'—'}</b><span>Misses</span></div></div><div class="tip">${state.completed?`${makes}/${d.attempts} — ${pct(makes,d.attempts)}%`:`Tap Make as shots go in. Mark complete after all ${d.attempts} attempts.`}</div></div>`}
function renderTotals(){const el=document.getElementById('totalsBox');if(!el)return;const t=activeTotals(),p=getPlan();el.innerHTML=`<div class="badge-row"><span class="badge">Completed: ${t.completed}/${t.totalDrills} drills</span><span class="badge">Attempts: ${t.attempts}/${p.goal}</span><span class="badge">Makes: ${t.makes}</span><span class="badge">Misses: ${t.misses}</span><span class="badge">${t.percentage}%</span></div>`}
function finishSession(){const p=getPlan(),a=getActive(),drills=currentDrills().map(d=>{const x=a[d.id]||{};const makes=Math.min(Number(x.makes||0),d.attempts);return{id:d.id,name:d.name,cat:d.cat,attempts:d.attempts,makes,misses:x.completed?Math.max(0,d.attempts-makes):0,completed:!!x.completed}}).filter(d=>d.completed);if(!drills.length){alert('Mark at least one drill complete before saving.');return}const totalAttempts=drills.reduce((s,d)=>s+d.attempts,0),totalMakes=drills.reduce((s,d)=>s+d.makes,0);const s={id:new Date().toISOString(),timestamp:new Date().toISOString(),date:new Date().toLocaleDateString(),week:p.week,goalAttempts:p.goal,totalMakes,totalAttempts,totalMisses:totalAttempts-totalMakes,percentage:pct(totalMakes,totalAttempts),completedGoal:totalAttempts>=p.goal,drills};const hist=getSessions();hist.push(s);saveSessions(hist);reviewProgression();clearActive();document.getElementById('celebrateText').innerText=`${s.totalMakes}/${s.totalAttempts} • ${s.percentage}%`;document.getElementById('celebrate').style.display='flex';setTimeout(()=>{document.getElementById('celebrate').style.display='none';showView('Progress')},1600)}
function reviewProgression(){const p=getPlan(),ws=weekSessions();if(ws.length>=p.workoutsPerWeek){const complete=ws.filter(s=>s.completedGoal).length;const avg=Math.round(ws.reduce((sum,s)=>sum+(s.percentage||0),0)/ws.length);if(complete>=2&&avg>=55&&p.goal<200){p.week=Math.min(8,p.week+1);p.goal=weekTargets[p.week-1]||200}else if(complete===0&&p.goal>80){p.goal=Math.max(80,p.goal-10)}p.lastReview=todayKey();savePlan(p)}}
function renderProgress(c){const hist=getSessions().slice().reverse(),p=getPlan(),tot=careerStats(),ins=smartInsights();c.innerHTML=`<div class="section-title">Progress</div><div class="card"><strong>Current plan</strong><div class="grid" style="margin-top:12px"><div class="stat"><div class="stat-label">Week</div><div class="stat-num">${p.week}</div></div><div class="stat"><div class="stat-label">Attempts</div><div class="stat-num">${p.goal}</div></div><div class="stat"><div class="stat-label">This Week</div><div class="stat-num">${weekSessions().length}/${p.workoutsPerWeek}</div></div><div class="stat"><div class="stat-label">Best %</div><div class="stat-num">${tot.bestPct}%</div></div></div></div><div class="card"><strong>Key shooting stats</strong><div class="badge-row"><span class="badge">Career: ${tot.makes}/${tot.attempts} • ${tot.pct}%</span><span class="badge">FT: ${tot.ftPct}%</span><span class="badge">3PT: ${tot.threePct}%</span><span class="badge">Sessions: ${hist.length}</span></div></div><div class="card"><strong>Quick read</strong><div class="tip ${ins.mood}">${ins.primary}</div>${ins.secondary.map(x=>`<div class="mini-row">${x}</div>`).join('')}</div><div class="card"><strong>Recent sessions</strong>${hist.length?hist.slice(0,8).map(s=>`<div class="history-row">${s.date} — ${s.totalMakes}/${s.totalAttempts} • ${s.percentage}% ${s.completedGoal?'✅ full workout':'partial workout'}</div>`).join(''):'<p class="muted">No saved sessions yet.</p>'}</div><button class="secondary-btn danger" onclick="resetActive()">Clear Unsaved Today Data</button>`}
function careerStats(){const hist=getSessions();let makes=0,attempts=0,bestPct=0,ftM=0,ftA=0,thM=0,thA=0;hist.forEach(s=>{makes+=s.totalMakes||0;attempts+=s.totalAttempts||0;bestPct=Math.max(bestPct,s.percentage||0);(s.drills||[]).forEach(d=>{if(d.cat==='Free Throws'){ftM+=d.makes;ftA+=d.attempts}if(d.cat==='Three'){thM+=d.makes;thA+=d.attempts}})});return{makes,attempts,pct:pct(makes,attempts),bestPct,ftPct:pct(ftM,ftA),threePct:pct(thM,thA)}}
function bestLine(){const t=careerStats();return t.attempts?`Best ${t.bestPct}% • FT ${t.ftPct}% • 3PT ${t.threePct}%`:'Start your first workout'}
function simpleTip(p){if(p>=70)return'Great session. Keep the same form and add speed only when balanced.';if(p>=55)return'Solid base. Focus on repeatable release and balanced feet.';return'Slow down the shot. Quick gather, elbow in, high arc, hold follow-through.'}
function summarizeBy(key, sessions){const map={};sessions.forEach(s=>(s.drills||[]).forEach(d=>{const k=d[key]||d.name;map[k]=map[k]||{name:k,makes:0,attempts:0,misses:0,items:0};map[k].makes+=d.makes||0;map[k].attempts+=d.attempts||0;map[k].misses+=d.misses||Math.max(0,(d.attempts||0)-(d.makes||0));map[k].items++}));return Object.values(map).filter(x=>x.attempts>0).map(x=>({...x,pct:pct(x.makes,x.attempts)}))}
function smartInsights(){const hist=getSessions();if(hist.length===0)return{mood:'',primary:'Complete a few sessions and tips will update based on percentages, weak shot types, improvements, and setbacks.',secondary:['For now: use the same form routine, tap makes, and save every workout.']};const recent=hist.slice(-3),prior=hist.slice(0,Math.max(0,hist.length-3));const cats=summarizeBy('cat',hist).sort((a,b)=>a.pct-b.pct);const recentCats=summarizeBy('cat',recent);const priorCats=summarizeBy('cat',prior);const drills=summarizeBy('name',hist).sort((a,b)=>a.pct-b.pct);const weakCat=cats[0],strongCat=cats[cats.length-1],weakDrill=drills[0],strongDrill=drills[drills.length-1];let changes=[];recentCats.forEach(r=>{const p=priorCats.find(x=>x.name===r.name);if(p&&p.attempts>=10&&r.attempts>=10)changes.push({name:r.name,delta:r.pct-p.pct,recent:r.pct,prior:p.pct})});changes.sort((a,b)=>a.delta-b.delta);const setback=changes[0],improve=changes[changes.length-1];let primary=simpleTip(hist[hist.length-1].percentage||0),mood='';if(setback&&setback.delta<=-8){primary=`Setback: ${setback.name} is down ${Math.abs(setback.delta)} points recently (${setback.prior}% to ${setback.recent}%). Slow down there and get balanced before adding speed.`;mood='bad'}else if(weakCat){primary=`Biggest opportunity: ${weakCat.name} is the lowest percentage area at ${weakCat.pct}%. Spend the next workout trying to add 2–3 more makes there.`}if(improve&&improve.delta>=8){primary=`Improvement: ${improve.name} is up ${improve.delta} points recently (${improve.prior}% to ${improve.recent}%). Keep that routine the same.`;mood='good'}let secondary=[];if(weakDrill)secondary.push(`Most missed drill: ${weakDrill.name} — ${weakDrill.makes}/${weakDrill.attempts}, ${weakDrill.pct}%.`);if(strongDrill&&strongDrill.name!==weakDrill?.name)secondary.push(`Strongest drill: ${strongDrill.name} — ${strongDrill.makes}/${strongDrill.attempts}, ${strongDrill.pct}%.`);if(weakCat)secondary.push(`Shot type to prioritize: ${weakCat.name} — ${weakCat.misses} misses tracked.`);if(strongCat&&strongCat.name!==weakCat?.name)secondary.push(`Confidence area: ${strongCat.name} — ${strongCat.pct}%.`);if(setback&&setback.delta<0)secondary.push(`Recent setback: ${setback.name} down ${Math.abs(setback.delta)} percentage points.`);if(improve&&improve.delta>0)secondary.push(`Recent improvement: ${improve.name} up ${improve.delta} percentage points.`);return{mood,primary,secondary:secondary.slice(0,6),cats,drills,changes}}
function renderTips(c){const ins=smartInsights();const catRows=(ins.cats||[]).map(x=>`<div class="mini-row">${x.name}: ${x.makes}/${x.attempts} • ${x.pct}% • ${x.misses} misses</div>`).join('');const drillRows=(ins.drills||[]).slice(0,6).map(x=>`<div class="mini-row">${x.name}: ${x.pct}% (${x.makes}/${x.attempts})</div>`).join('');c.innerHTML=`<div class="section-title">Tips</div><div class="card hero"><div class="label">Percentage-based coaching</div><div class="tip ${ins.mood}">${ins.primary}</div><p class="muted">Tips update from saved sessions by comparing percentages, shot categories, most-missed drills, and recent improvement or setbacks.</p></div><div class="card"><strong>What to work on next</strong>${ins.secondary.map(x=>`<div class="mini-row">${x}</div>`).join('')}</div><div class="card"><strong>Shot type breakdown</strong>${catRows||'<p class="muted">Save sessions to see Form, Midrange, Three, and Free Throw patterns.</p>'}</div><div class="card"><strong>Drill breakdown</strong>${drillRows||'<p class="muted">Drill percentages will appear after workouts are saved.</p>'}</div><div class="card"><strong>Form reminders</strong><div class="badge-row"><span class="badge">Quick gather</span><span class="badge">Elbow in</span><span class="badge">High arc</span><span class="badge">Consistent release</span><span class="badge">Soft touch</span><span class="badge">Minimal jump on form shots</span><span class="badge">Hold follow-through</span></div></div>`}
function resetActive(){if(confirm('Clear unsaved makes and completed drills for today?')){clearActive();showView('Progress')}}
setupTabs();showView('Today');
</script>
