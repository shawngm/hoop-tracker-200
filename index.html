<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hoop Tracker 200</title>
  <style>
    :root{--orange:#ff7a00;--blue:#007aff;--green:#34c759;--red:#ff3b30;--dark:#111827;--card:#ffffff;--soft:#f3f4f6;--muted:#6b7280;--radius:22px}*{box-sizing:border-box;max-width:100%}html,body{width:100%;overflow-x:hidden}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:radial-gradient(circle at top,#334155 0,#111827 45%,#030712 100%);color:#fff;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.header{position:sticky;top:0;z-index:10;background:rgba(3,7,18,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:env(safe-area-inset-top,14px);border-bottom:1px solid rgba(255,255,255,.08)}.brand{padding:14px 16px 4px;text-align:center}.brand h1{margin:0;font-size:22px;letter-spacing:-.5px}.brand p{margin:4px 0 0;color:#cbd5e1;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab-btn{border:0;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:900;white-space:nowrap;scroll-snap-align:start}.tab-btn.active{background:#fff;color:#111827;transform:scale(1.03)}.container{width:100%;max-width:560px;margin:0 auto;padding:16px 14px 110px}.section-title{font-size:24px;font-weight:950;margin:6px 2px 14px;text-shadow:0 2px 10px rgba(0,0,0,.35)}.card,.drill-card{background:rgba(255,255,255,.94);color:#111827;border-radius:var(--radius);padding:17px;margin-bottom:14px;box-shadow:0 14px 35px rgba(0,0,0,.22)}.hero{background:linear-gradient(135deg,#fff,#fff3e4)}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:950;color:var(--orange);margin-bottom:8px}.muted{color:var(--muted);font-size:13px;line-height:1.35;font-weight:650}.big{font-size:36px;font-weight:950;line-height:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:rgba(0,0,0,.06);border-radius:18px;padding:13px}.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:950}.stat-num{font-size:25px;font-weight:950;margin-top:4px}.shortcut{background:rgba(255,255,255,.94);border-radius:20px;color:#111827;min-height:86px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:950;padding:16px 10px}.shortcut small{display:block;color:var(--muted);font-size:12px;margin-top:5px;font-weight:750}.wide{grid-column:span 2}.progress-wrap{height:14px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden;margin:12px 0}.progress-fill{height:100%;background:var(--green);width:0;border-radius:999px;transition:.25s}.progress-fill.orange{background:var(--orange)}.drill-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.drill-name{font-size:18px;font-weight:950;line-height:1.1}.pill{background:#eef2ff;color:#3730a3;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:950;white-space:nowrap}.last-line{background:#eff6ff;color:#075985;border-radius:14px;padding:9px 11px;font-size:13px;line-height:1.25;font-weight:850;margin-bottom:10px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputs label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:950;margin-bottom:5px}input,textarea{width:100%;min-width:0;background:var(--soft);border:0;border-radius:14px;color:#111827;font-size:16px;font-weight:800;padding:13px 12px}.miss-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.miss-btn{border:0;border-radius:14px;background:#f8fafc;color:#111827;padding:10px 8px;font-size:13px;font-weight:900}.miss-btn.active{background:#fff7ed;color:#9a3412;outline:2px solid #fed7aa}.finish-btn,.secondary-btn{width:100%;border:0;border-radius:20px;padding:17px;font-weight:950;margin-top:10px}.finish-btn{background:#111827;color:#fff;font-size:18px}.secondary-btn{background:rgba(0,0,0,.08);color:#111827;font-size:14px}.tip{border-left:5px solid var(--orange);padding:12px 12px;background:#fff7ed;border-radius:14px;margin-top:10px;font-weight:800;line-height:1.35}.history-row{border-top:1px solid rgba(0,0,0,.08);padding:11px 0;font-size:14px;font-weight:800}.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{border-radius:999px;background:rgba(0,0,0,.07);padding:8px 10px;font-size:12px;font-weight:900}.danger{background:#fee2e2;color:#991b1b}.celebrate{position:fixed;inset:0;background:rgba(3,7,18,.94);display:none;z-index:99;align-items:center;justify-content:center;text-align:center;padding:24px}.celebrate h2{font-size:38px;margin:0;color:#fbbf24}.celebrate p{color:#fff;font-weight:800}@media(max-width:360px){.container{padding-left:10px;padding-right:10px}.grid,.inputs,.miss-grid{grid-template-columns:1fr}.wide{grid-column:span 1}.drill-top{flex-direction:column}.big{font-size:30px}}
  </style>
</head>
<body>
  <div class="header"><div class="brand"><h1>🏀 Hoop Tracker 200</h1><p>Build makes. Track misses. Level up.</p></div><div class="tabs" id="tabs"></div></div>
  <main class="container" id="content"></main>
  <div class="celebrate" id="celebrate"><div><h2>Workout Saved</h2><p id="celebrateText">Progress is progress.</p></div></div>
<script>
const STORAGE={sessions:'hoop_sessions_v1',plan:'hoop_plan_v1',active:'hoop_active_v1'};
const tabs=['Today','Form','Midrange','Three','Free Throws','Progress','Tips'];
const missTypes=['short','long','left','right','flat','rushed','offBalance'];
const missLabels={short:'Short',long:'Long',left:'Left',right:'Right',flat:'Flat',rushed:'Rushed',offBalance:'Off-balance'};
const weekTargets=[80,100,120,140,160,175,190,200];
const allDrills=[
{id:'mikan',name:'Mikan Drill',cat:'Form',base:10,max:20,tip:'Soft touch. Eyes on the square. Finish high with both hands.'},
{id:'form3',name:'One-Hand Form — 3 Feet',cat:'Form',base:10,max:20,tip:'Minimal jump. Elbow in. Same release point every rep.'},
{id:'form5',name:'One-Hand Form — 5 Feet',cat:'Form',base:10,max:20,tip:'Quick gather, smooth lift, high arc, hold the follow-through.'},
{id:'form7',name:'One-Hand Form — 7 Feet',cat:'Form',base:0,max:20,tip:'Do not force distance. Keep touch soft and repeatable.'},
{id:'ft1',name:'Free Throws',cat:'Free Throws',base:10,max:20,tip:'Same routine every time. Breathe, bend, finish through the rim.'},
{id:'elbow',name:'Elbow to Elbow',cat:'Midrange',base:10,max:20,tip:'Sprint to balance. Square up before the shot.'},
{id:'mid5',name:'5 Spot Midrange',cat:'Midrange',base:15,max:25,tip:'One clean target at each spot. Feet set, eyes early.'},
{id:'three5',name:'5 Spot Three-Pointers',cat:'Three',base:10,max:25,tip:'Range comes from legs and rhythm, not pushing with the arms.'},
{id:'pull1',name:'1-Dribble Pull-Up',cat:'Midrange',base:0,max:15,tip:'Pound, plant, rise balanced. Do not fade unless intended.'},
{id:'pull2',name:'2-Dribble Pull-Up',cat:'Three',base:0,max:15,tip:'Slow the gather just enough to land balanced.'},
{id:'ft2',name:'Pressure Free Throws',cat:'Free Throws',base:5,max:20,tip:'Treat these like late-game reps. Same routine under fatigue.'}
];
function pct(m,a){return a?Math.round((Number(m||0)/Number(a||0))*100):0}function safe(v){return String(v).replace(/[^a-z0-9]/gi,'-').toLowerCase()}function todayKey(d=new Date()){return d.toISOString().slice(0,10)}function startOfWeek(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}function getSessions(){return JSON.parse(localStorage.getItem(STORAGE.sessions)||'[]')}function saveSessions(s){localStorage.setItem(STORAGE.sessions,JSON.stringify(s))}function defaultPlan(){return{week:1,goal:80,workoutsPerWeek:3,lastReview:null}}function getPlan(){return{...defaultPlan(),...(JSON.parse(localStorage.getItem(STORAGE.plan)||'null')||{})}}function savePlan(p){localStorage.setItem(STORAGE.plan,JSON.stringify(p))}function getActive(){return JSON.parse(localStorage.getItem(STORAGE.active)||'{}')}function saveActive(a){localStorage.setItem(STORAGE.active,JSON.stringify(a))}function clearActive(){localStorage.removeItem(STORAGE.active)}
function weekSessions(){const start=startOfWeek().toISOString();return getSessions().filter(s=>s.timestamp>=start)}function lastSession(){return getSessions().slice().sort((a,b)=>b.timestamp.localeCompare(a.timestamp))[0]||null}function lastForDrill(id){for(const s of getSessions().slice().reverse()){const d=(s.drills||[]).find(x=>x.id===id&&Number(x.attempts)>0);if(d)return{...d,date:s.date}}return null}
function targetsForGoal(goal){const totalBase=allDrills.reduce((s,d)=>s+d.base,0),totalMax=allDrills.reduce((s,d)=>s+d.max,0);const ratio=Math.max(0,Math.min(1,(goal-totalBase)/(totalMax-totalBase)));let rows=allDrills.map(d=>({...d,target:Math.round(d.base+(d.max-d.base)*ratio)})).filter(d=>d.target>0);let diff=goal-rows.reduce((s,d)=>s+d.target,0);let i=0;while(diff!==0&&rows.length){const d=rows[i%rows.length];if(diff>0&&d.target<d.max){d.target++;diff--}else if(diff<0&&d.target>d.base){d.target--;diff++}i++;if(i>500)break}return rows}
function currentDrills(){return targetsForGoal(getPlan().goal)}function drillVal(id,field){return (getActive()[id]||{})[field]||''}function missCount(id,type){return ((getActive()[id]||{}).misses||{})[type]||0}function updateVal(id,field,val){const a=getActive();a[id]=a[id]||{misses:{}};a[id][field]=Number(val||0);saveActive(a);renderTotals()}function incMiss(id,type){const a=getActive();a[id]=a[id]||{misses:{}};a[id].misses[type]=(a[id].misses[type]||0)+1;saveActive(a);showView(currentView)}
let currentView='Today';function setupTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab-btn ${t==='Today'?'active':''}" onclick="showView('${t}')">${t}</button>`).join('')}function showView(name){currentView=name;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.innerText===name));const c=document.getElementById('content');c.innerHTML='';if(name==='Today')return renderToday(c);if(name==='Progress')return renderProgress(c);if(name==='Tips')return renderTips(c);return renderCategory(c,name)}
function renderToday(c){const p=getPlan(),ws=weekSessions(),last=lastSession(),made=activeTotals().makes,goalPct=Math.min(100,Math.round((made/p.goal)*100));c.innerHTML=`<div class="section-title">Today</div><div class="card hero"><div class="label">Week ${p.week} plan</div><div class="big">${p.goal} makes</div><div class="progress-wrap"><div class="progress-fill orange" style="width:${goalPct}%"></div></div><p class="muted">${made} made so far today. Weekly target: ${p.workoutsPerWeek} workouts. Completed this week: ${ws.length}/${p.workoutsPerWeek}.</p></div><div class="grid"><div class="shortcut" onclick="showView('Form')">FORM<small>Mikan + touch</small></div><div class="shortcut" onclick="showView('Midrange')">MIDRANGE<small>Elbows + spots</small></div><div class="shortcut" onclick="showView('Three')">THREE<small>Range + rhythm</small></div><div class="shortcut" onclick="showView('Free Throws')">FREE THROWS<small>Routine + pressure</small></div><div class="shortcut wide" onclick="showView('Progress')">PROGRESS<small>${bestLine()}</small></div></div><div class="card"><strong>Last session</strong>${last?`<p class="muted">${last.date}: ${last.totalMakes}/${last.totalAttempts}, ${last.percentage}% • Week ${last.week}</p><div class="tip">Focus: ${topTip(last.misses).text}</div>`:`<p class="muted">No sessions yet. Start with form shots and keep the first week manageable.</p>`}</div><button class="finish-btn" onclick="finishSession()">Finish & Save Session</button>`}
function renderCategory(c,cat){const ds=currentDrills().filter(d=>d.cat===cat);c.innerHTML=`<div class="section-title">${cat}</div><div class="card"><strong>Quick cue</strong><p class="muted">Log makes and attempts. Tap miss buttons only when you notice a pattern. Keep it fast.</p><div id="totalsBox"></div></div>`;ds.forEach(d=>c.innerHTML+=drillCard(d));c.innerHTML+=`<button class="finish-btn" onclick="finishSession()">Finish & Save Session</button>`;renderTotals()}
function drillCard(d){const last=lastForDrill(d.id),makes=drillVal(d.id,'makes'),attempts=drillVal(d.id,'attempts');return`<div class="drill-card"><div class="drill-top"><div><div class="drill-name">${d.name}</div><p class="muted">${d.tip}</p></div><div class="pill">Target ${d.target}</div></div><div class="last-line">${last?`Last time (${last.date}): ${last.makes}/${last.attempts} — ${pct(last.makes,last.attempts)}%`:'Starter: focus on clean, repeatable makes.'}</div><div class="inputs"><div><label>Makes</label><input inputmode="numeric" type="number" min="0" value="${makes}" oninput="updateVal('${d.id}','makes',this.value)"></div><div><label>Attempts</label><input inputmode="numeric" type="number" min="0" value="${attempts}" oninput="updateVal('${d.id}','attempts',this.value)"></div></div><div class="miss-grid">${missTypes.map(t=>`<button class="miss-btn ${missCount(d.id,t)?'active':''}" onclick="incMiss('${d.id}','${t}')">${missLabels[t]} ${missCount(d.id,t)?'+'+missCount(d.id,t):'+'}</button>`).join('')}</div><div class="tip">Current: ${makes||0}/${attempts||0} — ${pct(makes,attempts)}%</div></div>`}
function activeTotals(){const a=getActive();let makes=0,attempts=0,misses={};missTypes.forEach(t=>misses[t]=0);currentDrills().forEach(d=>{const x=a[d.id]||{};makes+=Number(x.makes||0);attempts+=Number(x.attempts||0);missTypes.forEach(t=>misses[t]+=Number((x.misses||{})[t]||0))});return{makes,attempts,percentage:pct(makes,attempts),misses}}function renderTotals(){const el=document.getElementById('totalsBox');if(!el)return;const t=activeTotals();el.innerHTML=`<div class="badge-row"><span class="badge">Today: ${t.makes}/${t.attempts}</span><span class="badge">${t.percentage}%</span><span class="badge">Goal: ${getPlan().goal}</span></div>`}
function finishSession(){const p=getPlan(),a=getActive(),drills=currentDrills().map(d=>{const x=a[d.id]||{};return{id:d.id,name:d.name,cat:d.cat,target:d.target,makes:Number(x.makes||0),attempts:Number(x.attempts||0),misses:x.misses||{}}}).filter(d=>d.makes||d.attempts);const totals=activeTotals();if(!drills.length){alert('Add at least one drill before saving.');return}const s={id:new Date().toISOString(),timestamp:new Date().toISOString(),date:new Date().toLocaleDateString(),week:p.week,goalMakes:p.goal,totalMakes:totals.makes,totalAttempts:totals.attempts,percentage:totals.percentage,completedGoal:totals.makes>=p.goal,misses:totals.misses,drills};const hist=getSessions();hist.push(s);saveSessions(hist);reviewProgression();clearActive();document.getElementById('celebrateText').innerText=`${s.totalMakes}/${s.totalAttempts} • ${s.percentage}%`;document.getElementById('celebrate').style.display='flex';setTimeout(()=>{document.getElementById('celebrate').style.display='none';showView('Progress')},1600)}
function reviewProgression(){const p=getPlan(),ws=weekSessions();const hitCount=ws.filter(s=>s.completedGoal).length;if(ws.length>=p.workoutsPerWeek){if(hitCount>=2&&p.goal<200){p.week=Math.min(8,p.week+1);p.goal=weekTargets[p.week-1]||200}else if(hitCount===0&&p.goal>80){p.goal=Math.max(80,p.goal-10)}p.lastReview=todayKey();savePlan(p)}}function renderProgress(c){const hist=getSessions().slice().reverse(),p=getPlan(),tot=careerStats();c.innerHTML=`<div class="section-title">Progress</div><div class="card"><strong>Current plan</strong><div class="grid" style="margin-top:12px"><div class="stat"><div class="stat-label">Week</div><div class="stat-num">${p.week}</div></div><div class="stat"><div class="stat-label">Goal</div><div class="stat-num">${p.goal}</div></div><div class="stat"><div class="stat-label">This Week</div><div class="stat-num">${weekSessions().length}/${p.workoutsPerWeek}</div></div><div class="stat"><div class="stat-label">Best %</div><div class="stat-num">${tot.bestPct}%</div></div></div></div><div class="card"><strong>Key shooting stats</strong><div class="badge-row"><span class="badge">Career: ${tot.makes}/${tot.attempts} • ${tot.pct}%</span><span class="badge">FT: ${tot.ftPct}%</span><span class="badge">3PT: ${tot.threePct}%</span><span class="badge">Sessions: ${hist.length}</span></div></div><div class="card"><strong>Recent sessions</strong>${hist.length?hist.slice(0,8).map(s=>`<div class="history-row">${s.date} — ${s.totalMakes}/${s.totalAttempts} • ${s.percentage}% ${s.completedGoal?'✅ goal hit':'keep building'}</div>`).join(''):'<p class="muted">No saved sessions yet.</p>'}</div><button class="secondary-btn danger" onclick="resetActive()">Clear Unsaved Today Data</button>`}
function careerStats(){const hist=getSessions();let makes=0,attempts=0,bestPct=0,ftM=0,ftA=0,thM=0,thA=0;hist.forEach(s=>{makes+=s.totalMakes;attempts+=s.totalAttempts;bestPct=Math.max(bestPct,s.percentage||0);(s.drills||[]).forEach(d=>{if(d.cat==='Free Throws'){ftM+=d.makes;ftA+=d.attempts}if(d.cat==='Three'){thM+=d.makes;thA+=d.attempts}})});return{makes,attempts,pct:pct(makes,attempts),bestPct,ftPct:pct(ftM,ftA),threePct:pct(thM,thA)}}function bestLine(){const t=careerStats();return t.attempts?`Best ${t.bestPct}% • FT ${t.ftPct}% • 3PT ${t.threePct}%`:'Start your first workout'}
function topTip(m={}){let top='';let val=0;missTypes.forEach(t=>{if(Number(m[t]||0)>val){top=t;val=Number(m[t]||0)}});const tips={short:'Use your legs, finish high, and hold your follow-through.',long:'Control your power. Softer touch, same release point.',left:'Check elbow alignment, guide hand, and square your feet.',right:'Check elbow alignment, guide hand, and square your feet.',flat:'Add arc. Finish higher and let the ball climb.',rushed:'Slow the gather. Balance first, then release.',offBalance:'Land where you started. Get your feet under you before the shot.'};return{text:top?tips[top]:'Quick gather, elbow in, high arc, consistent release point, soft touch, hold follow-through.',type:top,count:val}}function renderTips(c){const a=activeTotals(),last=lastSession(),tip=topTip(a.misses&&Object.values(a.misses).some(Boolean)?a.misses:(last?last.misses:{}));c.innerHTML=`<div class="section-title">Tips</div><div class="card hero"><div class="label">Current coaching focus</div><div class="tip">${tip.text}</div><p class="muted">This is based on your current unsaved workout, or your last saved session if today is empty.</p></div><div class="card"><strong>Perfect shooting motion reminders</strong><div class="badge-row"><span class="badge">Quick gather</span><span class="badge">Elbow in</span><span class="badge">High arc</span><span class="badge">Consistent release</span><span class="badge">Soft touch</span><span class="badge">Minimal jump on form shots</span><span class="badge">Hold follow-through</span></div></div><div class="card"><strong>Miss pattern guide</strong><p class="muted"><b>Short:</b> legs, finish high, follow-through.<br><b>Long:</b> softer touch, control power.<br><b>Left/Right:</b> elbow alignment, guide hand, square feet.<br><b>Flat:</b> more arc, finish higher.<br><b>Rushed:</b> slow gather, stay balanced.<br><b>Off-balance:</b> land where you started.</p></div>`}function resetActive(){if(confirm('Clear unsaved makes/misses for today?')){clearActive();showView('Progress')}}setupTabs();showView('Today');
</script>
</body>
</html>
